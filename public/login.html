<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Log-In</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <div class="titulo">
    <h1>Tienda de Suplementos</h1>
  </div>

  <img src="img/logo.png" width="20%" alt="Logo" class="logo">

  <div class="formulario">
    <h2>Log-In</h2>
    <form action="/login" method="post">
        <label for="name">Nombre de Usuario:</label> <br>
        <input type="text" name="name" required> <br>
        <label for="password">Contraseña del Usuario:</label> <br>
        <input type="password" name="password" required> <br>
        <input type="submit" value="Enviar">
    </form>
    
    <a href="register.html">¿aun no tienes cuenta?</a>
  </div>

</body>
</html>
